   NUTRICIÓN
   ═══════════════════════════════════════════════════════════════════════════ */

/* Sólo las matrices que se pueden pintar por polígono. Las dos de línea base
   2018 se miden en calicatas georreferenciadas, no en ubicaciones E-S-C: viven
   en la capa de puntos "Calicatas 2018", no en el selector. */
function matricesDeGrupo(grupo){
    if(!NUT) return [];
    return NUT.matrices.filter(m => m.grupo === grupo && m.mapeable !== false);
}
function matrizActual(){
    return NUT ? NUT.matrices.find(m => m.id === S.nut.matriz) : null;
}
function paramsActuales(){
    return (NUT && NUT.params[S.nut.matriz]) || [];
}
function paramActual(){
    return paramsActuales().find(p => p.id === S.nut.param) || null;
}
function campanasActuales(){
    return (NUT && NUT.campanas[S.nut.matriz]) || [];
}

/* Lecturas que pasan los filtros vigentes. */
function lecturas(){
    if(!NUT) return [];
    const {matriz, param, fecha, prof} = S.nut;
    return NUT.lecturas.filter(l =>
        l.m === matriz && l.u &&
        (param == null || `${l.p} [${l.un || '-'}]` === param) &&
        (fecha == null || l.f === fecha) &&
        (prof == null || l.d === prof));
}

/* Valor por unidad del nivel activo.
   En ubicaciones es el valor medido. En sector / cuartel / equipo es el
   promedio de las muestras que caen dentro, y así se declara: acá no hay un
   agregado nativo del laboratorio como el que publica Ceres por píxel. */
function valoresNut(nivel){
    const out = new Map();
    const ls = lecturas();
    if(!ls.length) return out;

    const acum = new Map();
    ls.forEach(l => {
        const u = IDX.ubicaciones.get(l.u);
        if(!u) return;
        let clave;
        if(nivel === 'ubicaciones') clave = l.u;
        else if(nivel === 'sectores') clave = u.sector_id;
        else if(nivel === 'cuarteles') clave = u.cuartel_id;
        else clave = u.equipo_id;
        if(!acum.has(clave)) acum.set(clave, []);
        acum.get(clave).push(l);
    });

    const p = paramActual();
    acum.forEach((arr, clave) => {
        const v = arr.reduce((a,l) => a + l.v, 0) / arr.length;
        out.set(clave, {
            v, n:arr.length,
            e: p ? estadoDe(v, p) : null,
            fechas:[...new Set(arr.map(l => l.f))].sort().reverse(),
            labs:[...new Set(arr.map(l => l.lab).filter(Boolean))],
            clasif:[...new Set(arr.map(l => l.cl).filter(Boolean))],
            ubis:[...new Set(arr.map(l => l.u))]
        });
    });
    return out;
}

function estadoDe(v, p){
    if(v == null || !p) return null;
    if(p.escala === 'umbral'){
        for(const b of p.umbral.bandas){
            const lo = b.min == null ? -Infinity : b.min;
            const hi = b.max == null ?  Infinity : b.max;
            if(v >= lo && v < hi) return b.estado;
        }
        return p.umbral.bandas[p.umbral.bandas.length-1].estado;
    }
    const q = p.cuartiles;
    return v < q[0] ? 'q1' : v < q[1] ? 'q2' : v < q[2] ? 'q3' : 'q4';
}

/* Bandas visibles del parámetro activo, con su color y su etiqueta. */
function bandasDe(p){
    if(!p) return [];
    if(p.escala === 'umbral'){
        return p.umbral.bandas.map(b => ({
            clave:b.estado, min:b.min, max:b.max,
            label:t(ESTADO_ES[b.estado] || b.estado),
            color:STATUS_COLORS[b.estado]()
        }));
    }
    const q = p.cuartiles;
    const et = ['Bajo el predio','Medio-bajo','Medio-alto','Sobre el predio'];
    return [
        {clave:'q1', min:p.min, max:q[0]},
        {clave:'q2', min:q[0],  max:q[1]},
        {clave:'q3', min:q[1],  max:q[2]},
        {clave:'q4', min:q[2],  max:p.max}
    ].map((b,i) => ({...b, label:t(et[i]), color:SEM(RAMPA_REL[i])}));
}

function colorNut(v, p){
    if(v == null || !p) return SEM('--sem-grey');
    const e = estadoDe(v, p);
    if(!e) return SEM('--sem-grey');
    if(p.escala !== 'umbral'){
        const i = {q1:0,q2:1,q3:2,q4:3}[e];
        return SEM(RAMPA_REL[i]);
    }
    // Dentro de la banda se interpola, como en San Gerardo: el color sigue
    // siendo el de la banda, pero deja ver si está al borde de cruzarla.
    const b = p.umbral.bandas.find(x => x.estado === e);
    const pal = STATUS_PALETTES[e] ? STATUS_PALETTES[e]() : null;
    if(!b || !pal) return STATUS_COLORS[e]();
    let lo = b.min, hi = b.max;
    if(lo == null) lo = Math.min(p.min, hi - Math.abs(hi || 1) * 0.25);
    if(hi == null) hi = Math.max(p.max, lo + Math.abs(lo || 1) * 0.25);
    const k = hi === lo ? 0.5 : clamp01((v - lo) / (hi - lo));
    return mixHex(pal[0], pal[1], k);
}

/* ═══════════════════════════════════════════════════════════════════════════
   RIEGO · DropControl

   El dato NO se precalcula en un JSON del repo: lo sirve en vivo un Web App de
   Google Apps Script que habla con la API de DropControl del lado del servidor.
   Eso es lo que permite que este sitio sea público y que el mapa esté al día
   sin un workflow de CI: el token de DropControl vive en el Apps Script y nunca
   llega al navegador.

   El endpoint devuelve una ventana FIJA de una semana —ignora cualquier
   parámetro de rango— agregada por sector, con las mismas claves `E#-S#` que
   produce kmz_to_geojson.py. Cero mapeo necesario.
   ═══════════════════════════════════════════════════════════════════════════ */

const RIEGO_URL = 'https://script.google.com/macros/s/'
    + 'AKfycbx9ghgvxxHBwv67GhGsvTUwPNBb9X-z5mqMp1hQ3u5RRj2F8P4pxEKbrgtxhhjA_yXOaA/exec';

let RIEGO = null;            // respuesta cruda del endpoint
let riegoEstado = 'vacio';   // vacio | cargando | listo | error
let riegoError = null;

/* Métricas ofrecidas. `suma:true` significa que agregar por equipo es sumar —
   son volúmenes y horas, aditivos de verdad. Las demás se promedian ponderando
   por superficie, y la interfaz lo dice. */
const METRICAS_RIEGO = [
    {id:'total_m3',              es:'Volumen aplicado',     unidad:'m³',     suma:true,  dec:0},
    {id:'total_m3_ha',           es:'Volumen por hectárea', unidad:'m³/ha',  suma:false, dec:1},
    {id:'total_mm',              es:'Lámina aplicada',      unidad:'mm',     suma:false, dec:1},
    {id:'total_horas',           es:'Horas de riego',       unidad:'h',      suma:true,  dec:1},
    {id:'n_eventos',             es:'Eventos de riego',     unidad:'',       suma:true,  dec:0},
    {id:'frecuencia_dias',       es:'Frecuencia de riego',  unidad:'días',   suma:false, dec:1},
    {id:'duracion_promedio_hrs', es:'Duración promedio',    unidad:'h',      suma:false, dec:1},
    {id:'dias_sin_riego',        es:'Días sin riego',       unidad:'días',   suma:false, dec:0}
];
function metricaRiego(){
    return METRICAS_RIEGO.find(m => m.id === S.riego.metrica) || METRICAS_RIEGO[0];
}

async function cargarRiego(forzar){
    if(riegoEstado === 'cargando') return;
    if(RIEGO && !forzar) return;
    riegoEstado = 'cargando'; riegoError = null;
    renderLegend(); renderStats(); renderStamp();
    try{
        const r = await fetch(RIEGO_URL, {cache:'no-store'});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        if(!j || !Array.isArray(j.sectores)) throw new Error('respuesta sin sectores[]');
        RIEGO = j;
        riegoEstado = 'listo';
        // Una clave que no exista en la geometría es un cambio de grilla en
        // DropControl, y hay que verlo, no tragárselo.
        const huerfanos = j.sectores.map(x => x.key).filter(k => !IDX.sectores.has(k));
        if(huerfanos.length) console.warn('[ketcal] sectores de DropControl sin geometría:', huerfanos);
    }catch(e){
        riegoEstado = 'error'; riegoError = e.message;
        console.error('[ketcal] DropControl:', e);
    }
    if(currentMode === 'riego'){ repintar(); renderPanel(); }
}

/* Valor por unidad del nivel activo. Por sector es el dato medido; por equipo
   es la suma de sus sectores para las métricas aditivas, y el promedio
   ponderado por superficie para el resto. */
function valoresRiego(nivel){
    const out = new Map();
    if(riegoEstado !== 'listo' || !RIEGO) return out;
    const m = metricaRiego();

    if(nivel === 'sectores'){
        RIEGO.sectores.forEach(x => {
            if(!IDX.sectores.has(x.key)) return;
            out.set(x.key, {v: x[m.id] == null ? null : +x[m.id], n: x.n_eventos || 0, s: x});
        });
        return out;
    }
    const porEquipo = new Map();
    RIEGO.sectores.forEach(x => {
        if(!IDX.sectores.has(x.key)) return;
        const eq = x.equipo || x.key.split('-')[0];
        if(!porEquipo.has(eq)) porEquipo.set(eq, []);
        porEquipo.get(eq).push(x);
    });
    porEquipo.forEach((arr, eq) => {
        const vals = arr.filter(x => x[m.id] != null);
        let v = null;
        if(vals.length){
            v = m.suma
                ? vals.reduce((a,x) => a + (+x[m.id]), 0)
                : vals.reduce((a,x) => a + (+x[m.id]) * (x.area_ha || 0), 0)
                  / (vals.reduce((a,x) => a + (x.area_ha || 0), 0) || vals.length);
        }
        out.set(eq, {v, n: arr.reduce((a,x) => a + (x.n_eventos||0), 0),
                     s: {sectores: arr, area_ha: arr.reduce((a,x) => a + (x.area_ha||0), 0)}});
    });
    return out;
}

/* Escala: cuartiles de la propia ventana, y "sin riego" como clase aparte.
   Un sector con 0 m³ no es "el extremo bajo de la rampa": es la señal que hay
   que ver primero, y la rampa lo escondería entre los que regaron poco. */
function escalaRiego(vals){
    const m = metricaRiego();
    const num = [...vals.values()].map(d => d.v)
        .filter(v => v != null && !Number.isNaN(v) && v > 0).sort((a,b)=>a-b);
    const rampa = ['--dat-riego-1','--dat-riego-2','--dat-riego-3','--dat-riego-4','--dat-riego-5'];
    if(!num.length) return {cortes:[], colores:rampa.map(SEM), min:0, max:0, unidad:m.unidad, vacia:true};
    const k = rampa.length, cortes = [];
    for(let i=1;i<k;i++) cortes.push(num[Math.floor(i*num.length/k)]);
    return {cortes, colores:rampa.map(SEM), min:num[0], max:num[num.length-1],
            unidad:m.unidad, vacia:false};
}

function colorRiego(v, escala){
    if(v == null || Number.isNaN(v)) return SEM('--sem-grey');
    if(v === 0) return SEM('--dat-sin-riego');
    let i = 0;
    while(i < escala.cortes.length && v >= escala.cortes[i]) i++;
    return escala.colores[i];
}

function fmtRiego(v){
    const m = metricaRiego();
    return v == null || Number.isNaN(v) ? '—' : fmtDec(v, m.dec);
}

/* ═══════════════════════════════════════════════════════════════════════════
   PINTADO
   ═══════════════════════════════════════════════════════════════════════════ */

function nivelActivo(){
    if(currentMode === 'general') return S.gen.nivel;
    if(currentMode === 'riego')   return S.riego.nivel;
    return S.nut.nivel;
}

function repintar(){
    // Se comprueba que las capas existan, no `isStyleLoaded()`: ese devuelve
    // false mientras quedan fuentes cargando, justo después de addLayer, y el
    // primer pintado se perdía dejando los cuatro niveles en visibility:none.
    if(!GEO || !map.getLayer('sectores-fill')) return;
    const activo = nivelActivo();

    POLY_NIVELES.forEach(n => {
        const on = n === activo;
        ['fill','line','label'].forEach(sfx => {
            const id = `${n}-${sfx}`;
            if(!map.getLayer(id)) return;
            const vis = on && (sfx !== 'label' || S.capas.etiquetas) ? 'visible' : 'none';
            map.setLayoutProperty(id, 'visibility', vis);
        });
    });

    const exprColor = ['match', ['get','id']];
    const exprLabel = ['match', ['get','id']];

    if(currentMode === 'general'){
        const escala = escalaGen(activo);
        feats(activo).forEach(f => {
            const p = f.properties;
            exprColor.push(p.id, colorGen(escala, valorGen(p)));
            exprLabel.push(p.id, etiquetaGen(p, escala));
        });
        window._escalaGen = escala;
    }else if(currentMode === 'riego'){
        const vals = valoresRiego(activo);
        const escala = escalaRiego(vals);
        feats(activo).forEach(f => {
            const id = f.properties.id;
            const d = vals.get(id);
            exprColor.push(id, d ? colorRiego(d.v, escala) : SEM('--sem-grey'));
            exprLabel.push(id, d && d.v != null
                ? `${nombreCorto(f.properties)}\n${fmtRiego(d.v)}`
                : nombreCorto(f.properties));
        });
        window._valsRiego = vals; window._escalaRiego = escala;
    }else{
        const p = paramActual();
        const vals = valoresNut(activo);
        feats(activo).forEach(f => {
            const id = f.properties.id;
            const d = vals.get(id);
            exprColor.push(id, d ? colorNut(d.v, p) : SEM('--sem-grey'));
            exprLabel.push(id, d ? `${nombreCorto(f.properties)}\n${fmtP(d.v, p)}` : nombreCorto(f.properties));
        });
        window._valsNut = vals;
    }
    exprColor.push(SEM('--sem-grey'));
    exprLabel.push('');

    if(map.getLayer(`${activo}-fill`)) map.setPaintProperty(`${activo}-fill`, 'fill-color', exprColor);
    if(map.getLayer(`${activo}-label`)) map.setLayoutProperty(`${activo}-label`, 'text-field', exprLabel);

    ['valvulas-pt'].forEach(id => map.getLayer(id) &&
        map.setLayoutProperty(id, 'visibility', S.capas.valvulas ? 'visible' : 'none'));
    ['pozos-pt','pozos-label'].forEach(id => map.getLayer(id) &&
        map.setLayoutProperty(id, 'visibility', S.capas.pozos ? 'visible' : 'none'));
    if(map.getLayer('calicatas-pt'))
        map.setLayoutProperty('calicatas-pt', 'visibility',
            S.capas.calicatas && currentMode !== 'general' ? 'visible' : 'none');

    renderLegend();
    renderStats();
    renderStamp();
}

function nombreCorto(p){
    return p.id && p.id.match(/^E\d+$/) ? `E${p.equipo}` : (p.name || p.id);
}
function etiquetaGen(p, escala){
    const base = nombreCorto(p);
    if(S.gen.color === 'superficie') return `${base}\n${fmtVal(p.ha)} ha`;
    if(S.gen.color === 'caudal' && p.caudal_m3h && p.ha)
        return `${base}\n${fmtVal(p.caudal_m3h/p.ha)} m³/h/ha`;
    if(S.gen.color === 'analisis'){
        const n = nMuestrasDe(p);
        return n ? `${base}\n${n} ${t('muestras')}` : base;
    }
    return base;
}

function renderLegend(){
    const el = document.getElementById('legend');
    const activo = nivelActivo();

    if(currentMode === 'general'){
        const escala = window._escalaGen || escalaGen(activo);
        const titulo = t(CRITERIOS[S.gen.color].es);
        let filas = '';
        if(escala.tipo === 'cat'){
            const conteo = new Map();
            const supf = new Map();
            feats(activo).forEach(f => {
                const v = valorGen(f.properties);
                if(v == null) return;
                conteo.set(v, (conteo.get(v)||0)+1);
                supf.set(v, (supf.get(v)||0)+f.properties.ha);
            });
            filas = escala.clases.filter(c => conteo.has(c[0])).map(c =>
                `<div class="ket-lg-row"><span class="sw" style="background:${c[1]}"></span>`
                + `<span class="lb">${esc(nombreClase(c[0]))}</span>`
                + `<span class="rg">${fmtVal(supf.get(c[0]))} ha</span>`
                + `<span class="ct">${conteo.get(c[0])}</span></div>`).join('');
        }else{
            const bordes = [escala.min, ...escala.cortes, escala.max];
            const dec = decDe(escala.min, escala.max);
            filas = escala.colores.map((col,i) =>
                `<div class="ket-lg-row"><span class="sw" style="background:${col}"></span>`
                + `<span class="lb">${fmtDec(bordes[i], dec)} – ${fmtDec(bordes[i+1], dec)}</span>`
                + `<span class="rg">${esc(escala.unidad)}</span></div>`).join('');
        }
        const sinDato = feats(activo).filter(f => valorGen(f.properties) == null).length;
        el.innerHTML = `<div class="legend-label">${esc(titulo)}</div>${filas}`
            + (sinDato ? `<div class="ket-lg-row"><span class="sw" style="background:${SEM('--sem-grey')}"></span>`
                + `<span class="lb">${t('Sin dato')}</span><span class="ct">${sinDato}</span></div>` : '')
            + `<div class="ket-lg-foot">${t(NIVELES[activo].titulo)} · ${feats(activo).length} ${t('unidades')} · `
            + `${fmtVal(feats(activo).reduce((a,f)=>a+f.properties.ha,0))} ha</div>`;
        return;
    }

    if(currentMode === 'riego'){ el.innerHTML = legendRiego(activo); return; }

    const p = paramActual();
    if(!p){ el.innerHTML = `<div class="legend-label">${t('Sin dato')}</div>`; return; }
    const vals = window._valsNut || valoresNut(activo);
    const bandas = bandasDe(p);

    const conteo = new Map(), supf = new Map();
    let haTotal = 0;
    vals.forEach((d, id) => {
        const e = estadoDe(d.v, p);
        conteo.set(e, (conteo.get(e)||0)+1);
        const pr = props(activo, id);
        const ha = pr ? pr.ha : 0;
        supf.set(e, (supf.get(e)||0)+ha);
        haTotal += ha;
    });

    const filas = bandas.map(b => {
        const n = conteo.get(b.clave) || 0;
        const rango = b.min == null ? `< ${fmtP(b.max, p)}`
                    : b.max == null ? `≥ ${fmtP(b.min, p)}`
                    : `${fmtP(b.min, p)} – ${fmtP(b.max, p)}`;
        return `<div class="ket-lg-row"><span class="sw" style="background:${b.color}"></span>`
            + `<span class="lb">${esc(b.label)}</span><span class="rg">${rango}</span>`
            + `<span class="ct">${n}</span></div>`;
    }).join('');

    const sinDato = feats(activo).length - vals.size;
    const fuente = p.escala === 'umbral' ? p.umbral.fuente : 'relativa';
    const chip = fuente === 'laboquim'
        ? `<span class="ket-lg-src lab">${t('lab.')}</span> ${t('Umbral de laboratorio')}`
        : fuente === 'relativa'
        ? `<span class="ket-lg-src rel">${t('rel.')}</span> ${t('Escala relativa')}`
        : `<span class="ket-lg-src ref">${t('ref.')}</span> ${t('Umbral de referencia')}`;
    const nota = fuente === 'laboquim' ? t('Cortes impresos en el informe del laboratorio.')
        : fuente === 'relativa' ? t('Sin umbral agronómico definido: los cortes son los cuartiles del propio predio. Indica alto o bajo respecto del resto de Ketcal, no cumplimiento.')
        : t('Valor de referencia general para cítricos, pendiente de validación por agronomía. Se edita en umbrales_nutricion.json.');

    el.innerHTML = `<div class="legend-label">${esc(t(p.es === p.parametro ? p.parametro : p[LANG] || p.parametro))}`
        + (p.unidad ? ` <span class="sem-muted-xs">${esc(p.unidad)}</span>` : '') + `</div>`
        + filas
        + (sinDato ? `<div class="ket-lg-row"><span class="sw" style="background:${SEM('--sem-grey')}"></span>`
            + `<span class="lb">${t('sin muestrear')}</span><span class="ct">${sinDato}</span></div>` : '')
        + `<div class="ket-lg-foot">${chip}<br>${esc(nota)}`
        + (campanaAprox() ? `<br>${esc(t('* Fecha del informe: el laboratorio no registró fecha de muestreo.'))}` : '')
        + (activo !== 'ubicaciones' ? `<br>${esc(t('Promedio de las muestras de cada unidad. No es un agregado nativo del laboratorio.'))}` : '')
        + `<br>${fmtVal(haTotal)} ha ${t('con dato').toLowerCase()} ${t('de')} ${fmtVal(feats(activo).reduce((a,f)=>a+f.properties.ha,0))} ha</div>`;
}

/* El '*' del selector de muestreo marca las campañas cuya fecha viene del
   informe y no del muestreo. La diferencia son semanas, y en foliares importa. */
function campanaAprox(){
    const c = campanasActuales().find(x => x.fecha === S.nut.fecha);
    return !!(c && c.aprox);
}
/* ── Leyenda, métricas y ficha de Riego ─────────────────────────────────── */

function ventanaRiego(){
    if(!RIEGO || !RIEGO.rango) return '';
    const d = iso => fmtFecha(String(iso).slice(0,10));
    return `${d(RIEGO.rango.inicio)} – ${d(RIEGO.rango.fin)}`;
}

function legendRiego(activo){
    const m = metricaRiego();
    if(riegoEstado === 'cargando')
        return `<div class="legend-label">${t('Riego')}</div>`
             + `<div class="sem-muted-xs">${t('Consultando DropControl…')}</div>`;
    if(riegoEstado === 'error')
        return `<div class="legend-label">${t('Riego')}</div>`
             + `<div class="sem-muted-xs">${t('No se pudo consultar DropControl.')} ${esc(riegoError||'')}</div>`
             + `<div style="margin-top:8px"><button type="button" class="ket-chip" onclick="cargarRiego(true)">${t('Reintentar')}</button></div>`;

    const vals = window._valsRiego || valoresRiego(activo);
    const escala = window._escalaRiego || escalaRiego(vals);
    const total = feats(activo).length;
    const sinRiego = [...vals.values()].filter(d => d.v === 0 || d.n === 0).length;
    const sinDato = total - vals.size;

    let filas = '';
    if(!escala.vacia){
        const bordes = [escala.min, ...escala.cortes, escala.max];
        const conteo = escala.colores.map(() => 0);
        vals.forEach(d => {
            if(d.v == null || d.v <= 0) return;
            let i = 0;
            while(i < escala.cortes.length && d.v >= escala.cortes[i]) i++;
            conteo[i]++;
        });
        filas = escala.colores.map((col,i) => conteo[i] === 0 ? '' :
            `<div class="ket-lg-row"><span class="sw" style="background:${col}"></span>`
            + `<span class="lb">${fmtDec(bordes[i], m.dec)} – ${fmtDec(bordes[i+1], m.dec)}</span>`
            + `<span class="rg">${esc(m.unidad)}</span>`
            + `<span class="ct">${conteo[i]}</span></div>`).join('');
    }

    // Ventana sin un solo evento: hay que decir qué significa. Una leyenda con
    // una sola fila gris deja al usuario sin saber si el predio no regó o si
    // el mapa se rompió.
    const vacio = escala.vacia
        ? `<div class="ket-note">${esc(t('Ninguno de los 28 sectores registra eventos de riego en esta ventana. Puede ser real (receso invernal) o falta de reporte de las casetas.'))}</div>`
        : '';

    return `<div class="legend-label">${esc(t(m.es))}`
        + (m.unidad ? ` <span class="sem-muted-xs">${esc(m.unidad)}</span>` : '') + `</div>`
        + filas
        + (sinRiego ? `<div class="ket-lg-row"><span class="sw" style="background:${SEM('--dat-sin-riego')}"></span>`
            + `<span class="lb">${t('Sin riego en la ventana')}</span><span class="ct">${sinRiego}</span></div>` : '')
        + (sinDato ? `<div class="ket-lg-row"><span class="sw" style="background:${SEM('--sem-grey')}"></span>`
            + `<span class="lb">${t('Sin respuesta de la caseta')}</span><span class="ct">${sinDato}</span></div>` : '')
        + `<div class="ket-lg-foot">`
        + `<span class="ket-lg-src rel">${t('rel.')}</span> ${t('Cortes por cuartiles de la propia ventana.')}`
        + `<br>${t('Ventana')}: ${esc(ventanaRiego())}`
        + (activo === 'equipos'
            ? `<br>${esc(t(m.suma ? 'Suma de los sectores del equipo. El caudal se mide por sector, así que la suma es exacta.'
                             : 'Promedio de las muestras de cada unidad. No es un agregado nativo del laboratorio.'))}`
            : `<br>${esc(t('El volumen se mide por sector de riego. No se ofrece por cuartel porque repartirlo exigiría suponer cómo se distribuye dentro del sector.'))}`)
        + `</div>`
        + vacio;
}

function statsRiego(activo){
    const div = '<div class="stat-div"></div>';
    if(riegoEstado !== 'listo')
        return stat('—', t(riegoEstado === 'cargando' ? 'Consultando DropControl…'
                         : riegoEstado === 'error' ? 'No se pudo consultar DropControl.' : 'Sin dato'));
    const r = RIEGO.resumen || {};
    const vals = window._valsRiego || valoresRiego(activo);
    const conRiego = [...vals.values()].filter(d => (d.n || 0) > 0).length;
    return [
        stat(fmt(r.total_m3 || 0, 0), `${t('Total aplicado')} (m³)`),
        stat(fmtDec(r.total_m3_ha || 0, 1), 'm³/ha'),
        stat(`${conRiego}<span class="sem-muted-xs"> / ${vals.size}</span>`,
             `${t('Sectores con riego')} · ${t(NIVELES[activo].titulo)}`),
        stat(fmt(RIEGO.total_eventos_api || 0, 0), t('Eventos de riego')),
        stat(fmtVal(r.hectareas_total || 0), `${t('Superficie')} (ha)`)
    ].join(div);
}

function fichaRiego(p){
    const vals = window._valsRiego || valoresRiego(nivelActivo());
    const d = vals.get(p.id);
    const m = metricaRiego();
    if(!d) return `<div class="ket-empty">${t('Sin respuesta de la caseta')}</div>`;
    const x = d.s;

    let html = `<div class="pv-chart-card" style="display:flex;align-items:baseline;gap:10px">`
        + `<div style="font-size:26px;font-weight:300;color:var(--sem-ink)">${fmtRiego(d.v)}</div>`
        + `<div class="sem-muted-xs">${esc(m.unidad)}</div>`
        + `<div class="ket-chip" style="margin-left:auto">${d.n ? `${d.n} ${d.n===1?t('evento'):t('eventos')}` : t('Sin eventos')}</div>`
        + `</div>`;

    html += kv([
        [t('Volumen aplicado'), x.total_m3 != null ? `${fmt(x.total_m3,0)} m³` : null],
        [t('Volumen por hectárea'), x.total_m3_ha != null ? `${fmtDec(x.total_m3_ha,1)} m³/ha` : null],
        [t('Lámina aplicada'), x.total_mm != null ? `${fmtDec(x.total_mm,1)} mm` : null],
        [t('Horas de riego'), x.total_horas != null ? `${fmtDec(x.total_horas,1)} h` : null],
        [t('Frecuencia de riego'), x.frecuencia_dias ? `${fmtDec(x.frecuencia_dias,1)} ${t('días')}` : null],
        [t('Duración promedio'), x.duracion_promedio_hrs ? `${fmtDec(x.duracion_promedio_hrs,1)} h` : null],
        [t('Último evento'), x.ultimo_evento ? esc(String(x.ultimo_evento).slice(0,16).replace('T',' ')) : null],
        [t('Días sin riego'), x.dias_sin_riego != null ? fmt(x.dias_sin_riego,0) : null],
        [t('Superficie'), `${fmtVal(p.ha)} ha`],
        [t('Caudal de diseño'), p.caudal_m3h != null ? `${fmt(p.caudal_m3h,1)} m³/h` : null],
        [t('Válvulas'), p.n_valvulas || null]
    ]);

    // Eventos individuales. La forma exacta de cada evento todavía no se pudo
    // observar (el endpoint devolvió cero en todas las consultas), así que se
    // renderiza lo que venga en vez de asumir un esquema.
    const ev = Array.isArray(x.eventos) ? x.eventos : [];
    if(ev.length){
        html += sect(t('Eventos de riego'), `<div class="ket-rank">` + ev.slice(0,40).map(e => {
            const campos = Object.entries(e)
                .filter(([,v]) => v != null && v !== '')
                .map(([k,v]) => `${esc(k)}: ${typeof v === 'number' ? fmtVal(v) : esc(String(v))}`);
            return `<div class="ket-row"><span class="nm">${campos.join(' · ')}</span></div>`;
        }).join('') + `</div>`
        + (ev.length > 40 ? `<div class="sem-muted-xs" style="margin-top:6px">+${ev.length-40}</div>` : ''));
    }else{
        html += `<div class="ket-note">${t('Sin riego en la ventana')} · ${esc(ventanaRiego())}</div>`;
    }

    if(x.sectores){
        html += sect(t('Sectores del equipo'), chipsUnidades(x.sectores.map(y => y.key), 'sectores'));
    }
    if(x.data_ok === false){
        html += `<div class="ket-note">${t('Sin respuesta de la caseta')}</div>`;
    }
    return html;
}

function nombreClase(v){
    if(v === 'Lim') return LANG==='en' ? 'Lemon' : 'Limoneros';
    if(v === 'Nar') return LANG==='en' ? 'Orange' : 'Naranjos';
    if(v === 'Man') return LANG==='en' ? 'Mandarin' : 'Mandarinos';
    if(/^E\d$/.test(v)) return `${t('Equipo')} ${v.slice(1)}`;
    return v;
}

function stat(num, unidad){
    return `<div class="stat"><div class="num">${num}</div><div class="unit">${esc(unidad)}</div></div>`;
}
function renderStats(){
    const bar = document.getElementById('statsBar');
    const el = document.getElementById('statsContent');
    const activo = nivelActivo();
    const div = '<div class="stat-div"></div>';

    if(currentMode === 'general'){
        const T = GEO.totales;
        el.innerHTML = [
            stat(fmtVal(T.ha_sectores), t('Superficie total') + ' (ha)'),
            stat(T.equipos, t('Equipos')),
            stat(T.sectores, t('Sectores')),
            stat(T.cuarteles, t('Cuarteles')),
            stat(fmt(T.caudal_m3h,0), t('Caudal') + ' (m³/h)'),
            stat(T.valvulas, t('Válvulas'))
        ].join(div);
        bar.classList.remove('hidden');
        return;
    }

    if(currentMode === 'riego'){
        el.innerHTML = statsRiego(activo);
        bar.classList.remove('hidden');
        return;
    }

    const p = paramActual();
    const vals = window._valsNut || valoresNut(activo);
    if(!p || !vals.size){
        el.innerHTML = `<div class="stat"><div class="num">—</div><div class="unit">${t('Sin dato')}</div></div>`;
        bar.classList.remove('hidden');
        return;
    }
    const arr = [...vals.entries()];
    const nums = arr.map(([,d]) => d.v).sort((a,b)=>a-b);
    const mediana = nums[Math.floor(nums.length/2)];
    const enOptimo = arr.filter(([,d]) => estadoDe(d.v,p) === 'optimo').length;
    const fuera = arr.filter(([,d]) => ['deficiente','excesivo'].includes(estadoDe(d.v,p))).length;
    const peor = arr.slice().sort((a,b) => severidad(b[1].v,p) - severidad(a[1].v,p))[0];
    const nMuestras = lecturas().length;

    const items = [
        stat(`${vals.size}<span class="sem-muted-xs"> / ${feats(activo).length}</span>`,
             `${t('Con dato')} · ${t(NIVELES[activo].titulo)}`),
        stat(fmtP(mediana, p), `${t('Mediana')}${p.unidad ? ' ('+p.unidad+')' : ''}`)
    ];
    if(p.escala === 'umbral'){
        items.push(stat(`${enOptimo}<span class="sem-muted-xs"> / ${vals.size}</span>`, t('En óptimo')));
        items.push(stat(String(fuera), t('Fuera de rango')));
    }
    if(peor) items.push(stat(`<span style="font-size:12.5px">${esc(peor[0])}</span>`,
        `${t('Peor unidad')} · ${fmtP(peor[1].v, p)}`));
    items.push(stat(String(nMuestras), t('Muestras')));

    el.innerHTML = items.join(div);
    bar.classList.remove('hidden');
}

/* Distancia al óptimo, para ordenar de peor a mejor.
   Dentro del rango devuelve un negativo proporcional al margen que le queda al
   valor antes de salirse. Sin eso, las unidades en óptimo empataban todas en 0
   y el "ranking" quedaba en el orden en que venían: con los 14 foliares dentro
   de rango, la unidad que el mapa señalaba como peor era arbitraria. */
function severidad(v, p){
    if(v == null || !p) return -Infinity;
    if(p.escala !== 'umbral'){
        const q = p.cuartiles;
        return Math.abs(v - q[1]) / (Math.abs(q[1]) || 1);
    }
    const [lo, hi] = p.umbral.optimo;
    if(lo != null && v < lo) return (lo - v) / (Math.abs(lo) || 1);
    if(hi != null && v > hi) return (v - hi) / (Math.abs(hi) || 1);
    const ancho = (hi != null && lo != null) ? (hi - lo) : Math.abs(hi ?? lo ?? 1);
    const margen = Math.min(lo != null ? v - lo : Infinity, hi != null ? hi - v : Infinity);
    return -(margen / (Math.abs(ancho) || 1));
}

/* Las calicatas del estudio 2018 no son unidades productivas: son 13 puntos de
   muestreo con su perfil físico y, en cuatro de ellos, también el químico.
   Es la línea base contra la que se leen los análisis actuales. */
function fichaCalicata(p){
    let html = kv([
        [t('Textura'), p.textura],
        [t('Profundidad efectiva'), p.prof_efectiva_cm != null ? `${fmt(p.prof_efectiva_cm,0)} cm` : null],
        ['Arena / Limo / Arcilla', p.arena != null ? `${fmt(p.arena,0)} / ${fmt(p.limo,0)} / ${fmt(p.arcilla,0)} %` : null],
        ['CRACC', p.cracc != null ? `${fmtVal(p.cracc)} % vol.` : null],
        ['CRAPMP', p.crapmp != null ? `${fmtVal(p.crapmp)} % vol.` : null],
        [t('Ubicación'), p.ubicacion]
    ]);
    if(p.ubicacion){
        html += `<div style="margin-top:9px">` + chipsUnidades([p.ubicacion], 'ubicaciones') + `</div>`;
    }else{
        html += `<div class="ket-note">${t('Calicata')} ${esc(p.calicata)}: ${LANG==='en'
            ? 'falls outside the mapped blocks.' : 'cae fuera de los cuarteles mapeados.'}</div>`;
    }
    const porMatriz = {};
    (p.perfil || []).forEach(r => { (porMatriz[r.m] = porMatriz[r.m] || []).push(r); });
    Object.entries(porMatriz).forEach(([mid, filas]) => {
        const m = NUT.matrices.find(x => x.id === mid);
        html += sect(m ? t(m.es) : mid, kv(filas.map(r =>
            [`${r.p}${r.un ? ' ('+r.un+')' : ''}${r.d ? ' · '+r.d+' cm' : ''}`, fmtVal(r.v)])));
    });
    html += `<div class="ket-note">${t('Limitantes del estudio 2018')}: `
        + esc((NUT.limitantes_2018 || []).map(l => l.Factor).filter(Boolean).join(' · ')) + `</div>`;
    return html;
}

function kv(filas){
    return `<dl class="ket-kv">` + filas.filter(f => f[1] != null && f[1] !== '' && f[1] !== '—')
        .map(f => `<dt>${esc(f[0])}</dt><dd>${f[1]}</dd>`).join('') + `</dl>`;
}
function sect(titulo, html){
    return `<div class="ket-sect"><div class="ket-sect-title">${esc(titulo)}</div>${html}</div>`;
}
function chipsUnidades(lista, nivel){
    if(!lista || !lista.length) return `<div class="sem-muted-xs">—</div>`;
    return `<div class="ket-chips">` + lista.map(r => {
        const id = typeof r === 'string' ? r : r.id;
        const et = typeof r === 'string' ? r
            : `${r.name}${r.frac != null ? ` · ${Math.round(r.frac*100)}%` : ''}`;
        return `<button type="button" class="ket-chip" onclick="irA('${nivel}','${esc(id)}')">${esc(et)}</button>`;
    }).join('') + `</div>`;
}
function irA(nivel, id){
    if(currentMode === 'general') setNivelGen(nivel, true);
    else setNivelNut(nivel, true);
    seleccionar(nivel, id, true);
}

    const nMuestras = nMuestrasDe(p);
    const filas = [
        [t('Superficie calculada'), `${fmtVal(p.ha)} ha`],
        [t('Superficie KMZ'), p.ha_kmz != null ? `${fmtVal(p.ha_kmz)} ha` : null],
        [t('Caudal de diseño'), p.caudal_m3h != null ? `${fmt(p.caudal_m3h,1)} m³/h` : null],
        [t('Caudal por hectárea'), p.caudal_m3h && p.ha ? `${fmtVal(p.caudal_m3h/p.ha)} m³/h/ha` : null],
        [t('Válvulas'), p.n_valvulas || null],
        [t('Especie'), (p.especies || (p.especie_corta ? [p.especie_corta] : [])).map(nombreClase).join(' · ') || null],
        [t('Variedad'), p.variedad || (p.variedades || []).join(' / ') || null],
        [t('Equipo'), p.equipo_id || (p.equipos || []).join(' · ') || null],
        [t('Portainjerto'), cob ? cob.portainjerto : portainjertoDe(p)],
        [t('Año de plantación'), anioDe(p)],
        [t('Plantas por hectárea'), cob && cob.plantas_ha ? fmt(cob.plantas_ha,0) : null],
        [t('Centro de costo'), cob ? cob.centro_costo : null],
        [t('Rol'), cob ? cob.rol : null],
        [t('Emisores por hectárea'), cob && cob.goteros_ha ? fmt(cob.goteros_ha,0) : null],
        [t('Caudal por emisor'), cob && cob.caudal_emisor ? `${fmtVal(cob.caudal_emisor)} L/h` : null],
        [t('Distancia entre goteros'), cob && cob.dist_goteros ? `${fmtVal(cob.dist_goteros)} m` : null]
    ];

    let html = kv(filas);

    if(p.cuarteles && p.cuarteles.length)
        html += sect(t('Cuarteles regados'), chipsUnidades(p.cuarteles, 'cuarteles'));
    if(p.sectores && p.sectores.length)
        html += sect(typeof p.sectores[0] === 'string' ? t('Sectores del equipo') : t('Sectores que lo riegan'),

    if(ubis.length) html += sect('Ubicaciones E-S-C', chipsUnidades(ubis, 'ubicaciones'));

        : `<div class="ket-empty">${t('Sin análisis registrados para esta unidad.')}</div>`);

    return html;

function fichaNutricion(p){
    const par = paramActual();
    const activo = nivelActivo();
    const vals = window._valsNut || valoresNut(activo);
    const d = vals.get(p.id);

    let html = '';
    if(d && par){
        const e = estadoDe(d.v, par);
        const banda = bandasDe(par).find(b => b.clave === e);
        html += `<div class="pv-chart-card" style="display:flex;align-items:baseline;gap:10px">`
            + `<div style="font-size:26px;font-weight:300;color:var(--sem-ink)">${fmtP(d.v, par)}</div>`
            + `<div class="sem-muted-xs">${esc(par.unidad||'')}</div>`
            + (banda ? `<div class="ket-chip" style="margin-left:auto;background:${banda.color};color:var(--sem-surface);border:none">${esc(banda.label)}</div>` : '')
            + `</div>`;
        html += kv([
            [t('Muestras'), d.n],
            [t('Muestreo'), d.fechas.map(fmtFecha).join(' · ')],
            [t('Laboratorio'), d.labs.join(' · ')],
            [t('Clasificación lab.'), d.clasif.join(' · ')],
            [t('Rango óptimo'), par.escala === 'umbral'
                ? `${par.umbral.optimo[0] != null ? fmtP(par.umbral.optimo[0], par) : '≤'} – ${par.umbral.optimo[1] != null ? fmtP(par.umbral.optimo[1], par) : '∞'}`
                : null],
            [t('Superficie'), `${fmtVal(p.ha)} ha`]
        ]);
        html += sect(t('Evolución temporal'), sparkUnidad(p.id, activo, par));
    }else{
        html += `<div class="ket-empty">${t('Sin dato para este parámetro y muestreo.')}</div>`;
        html += kv([[t('Superficie'), `${fmtVal(p.ha)} ha`],
                    [t('Especie'), (p.especies||[p.especie_corta]).filter(Boolean).map(nombreClase).join(' · ')]]);
    }

    // Ranking del muestreo activo: qué mirar primero.
    const arr = [...vals.entries()].sort((a,b) => severidad(b[1].v,par) - severidad(a[1].v,par));
    if(arr.length > 1){
        const max = Math.max(...arr.map(([,x]) => x.v));
        html += sect(`${t('Ranking')} · ${t(NIVELES[activo].titulo)}`,
            `<div class="ket-rank">` + arr.map(([id,x]) => {
                const col = colorNut(x.v, par);
                return `<div class="ket-row${id===p.id?' active':''}" onclick="seleccionar('${activo}','${esc(id)}',true)">`
                    + `<span class="sw" style="background:${col}"></span>`
                    + `<span class="nm">${esc(id)}</span>`
                    + `<span class="vl">${fmtP(x.v, par)}</span></div>`;
            }).join('') + `</div>`);
    }
    return html;
}

/* Serie temporal de una unidad para el parámetro activo, como SVG inline. */
function serieDe(id, nivel, par){
    if(!NUT || !par) return [];
    const [nombre, unidad] = [par.parametro, par.unidad];
    const porFecha = new Map();
    NUT.lecturas.forEach(l => {
        if(l.m !== S.nut.matriz || l.p !== nombre || (l.un||null) !== (unidad||null) || !l.u || !l.f) return;
        if(S.nut.prof != null && l.d !== S.nut.prof) return;
        const u = IDX.ubicaciones.get(l.u);
        if(!u) return;
        const clave = nivel === 'ubicaciones' ? l.u
                    : nivel === 'sectores' ? u.sector_id
                    : nivel === 'cuarteles' ? u.cuartel_id : u.equipo_id;
        if(clave !== id) return;
        if(!porFecha.has(l.f)) porFecha.set(l.f, []);
        porFecha.get(l.f).push(l.v);
    });
    return [...porFecha.entries()]
        .map(([f,vs]) => ({f, v:vs.reduce((a,b)=>a+b,0)/vs.length, n:vs.length}))
        .sort((a,b) => a.f < b.f ? -1 : 1);
}

/* Eje X categórico: los muestreos no son equidistantes en el tiempo y un eje
   lineal deja el gráfico medio vacío. */
function sparkline(serie, par, opts){
    opts = opts || {};
    const W = opts.w || 320, H = opts.h || 130;
    const ML = 40, MR = 8, MT = 10, MB = 26;
    if(serie.length < 2)
        return `<div class="nut-evo-empty">${t('Se necesitan al menos dos muestreos.')}</div>`;

    const bandas = bandasDe(par);
    const vs = serie.map(s => s.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    bandas.forEach(b => {
        if(b.min != null){ lo = Math.min(lo, b.min); hi = Math.max(hi, b.min); }
        if(b.max != null){ lo = Math.min(lo, b.max); hi = Math.max(hi, b.max); }
    });
    const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.1 || 1;
    lo -= pad; hi += pad;

    const x = i => ML + (W - ML - MR) * (serie.length === 1 ? 0.5 : i / (serie.length - 1));
    const y = v => MT + (H - MT - MB) * (1 - (v - lo) / (hi - lo));

    let rects = '';
    bandas.forEach(b => {
        const y0 = y(b.max == null ? hi : Math.min(b.max, hi));
        const y1 = y(b.min == null ? lo : Math.max(b.min, lo));
        if(y1 - y0 <= 0) return;
        rects += `<rect x="${ML}" y="${y0.toFixed(1)}" width="${W-ML-MR}" height="${(y1-y0).toFixed(1)}" fill="${b.color}" opacity="0.20"/>`;
    });

    const linea = serie.map((s,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(s.v).toFixed(1)}`).join(' ');
    const dots = serie.map((s,i) =>
        `<circle class="${i===serie.length-1?'nc-dot-last':'nc-dot'}" cx="${x(i).toFixed(1)}" cy="${y(s.v).toFixed(1)}" r="${i===serie.length-1?3.5:2.5}"><title>${esc(fmtFecha(s.f))} · ${fmtP(s.v, par)}</title></circle>`).join('');

    const ticks = [lo + pad, hi - pad].map(v =>
        `<text class="nc-tick" x="${ML-5}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtP(v, par)}</text>`).join('');
    const xlabs = serie.map((s,i) => {
        if(serie.length > 5 && i % Math.ceil(serie.length/4) !== 0 && i !== serie.length-1) return '';
        return `<text class="nc-tick" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(s.f.slice(2,7))}</text>`;
    }).join('');

    return `<div class="nut-evo-chart${opts.big?' big':''}">`
        + `<svg viewBox="0 0 ${W} ${H}" role="img">`
        + rects
        + `<line class="nc-axis" x1="${ML}" y1="${H-MB}" x2="${W-MR}" y2="${H-MB}"/>`
        + `<line class="nc-axis" x1="${ML}" y1="${MT}" x2="${ML}" y2="${H-MB}"/>`
        + `<path class="nc-line" d="${linea}"/>${dots}${ticks}${xlabs}`
        + `</svg></div>`;
}

function sparkUnidad(id, nivel, par){
    const serie = serieDe(id, nivel, par);
    if(serie.length < 2) return `<div class="nut-evo-empty">${t('Se necesitan al menos dos muestreos.')}</div>`;
    return sparkline(serie, par, {w:340, h:140});
}

function openEvo(){
    const sel = document.getElementById('selEvoUnidad');
    const activo = nivelActivo();
    const conDato = new Set();
    NUT.lecturas.forEach(l => {
        if(l.m !== S.nut.matriz || !l.u) return;
        const u = IDX.ubicaciones.get(l.u);
        if(!u) return;
        conDato.add(activo === 'ubicaciones' ? l.u
            : activo === 'sectores' ? u.sector_id
            : activo === 'cuarteles' ? u.cuartel_id : u.equipo_id);
    });
    const ids = [...conDato].sort();
    sel.innerHTML = ids.map(id =>
        `<option value="${esc(id)}"${id === S.sel ? ' selected' : ''}>${esc(id)}</option>`).join('');
    if(!ids.length){ sel.innerHTML = `<option value="">—</option>`; }
    S.evoFocus = null;
    document.getElementById('evoOver').classList.add('visible');
    document.getElementById('evoOver').classList.remove('focused');
    renderEvo();
}
function closeEvo(){ document.getElementById('evoOver').classList.remove('visible'); }
function evoBack(){ S.evoFocus = null; document.getElementById('evoOver').classList.remove('focused'); renderEvo(); }
function evoFocus(pid){
    S.evoFocus = pid;
    document.getElementById('evoOver').classList.add('focused');
    renderEvo();
}

function renderEvo(){
    const id = document.getElementById('selEvoUnidad').value;
    const activo = nivelActivo();
    const m = matrizActual();
    document.getElementById('evoTitle').textContent = `${t('Evolución temporal')} · ${id || '—'}`;
    document.getElementById('evoSub').textContent = m ? t(m.es) : '';

    document.getElementById('evoLegend').innerHTML = paramActual()
        ? bandasDe(paramActual()).map(b =>
            `<span class="nut-evo-lg"><i style="background:${b.color};opacity:0.45"></i>${esc(b.label)}</span>`).join('')
        : '';

    const body = document.getElementById('evoBody');
    if(!id){ body.innerHTML = `<div class="nut-evo-empty">${t('Sin serie temporal para esta unidad.')}</div>`; return; }

    const lista = S.evoFocus ? paramsActuales().filter(p => p.id === S.evoFocus) : paramsActuales();
    const cards = lista.map(par => {
        const serie = serieDe(id, activo, par);
        if(!serie.length) return '';
        const ultimo = serie[serie.length-1];
        const e = estadoDe(ultimo.v, par);
        const banda = bandasDe(par).find(b => b.clave === e);
        const chart = serie.length >= 2
            ? sparkline(serie, par, S.evoFocus ? {w:820, h:300, big:true} : {})
            : `<div class="nut-evo-empty">${t('Se necesitan al menos dos muestreos.')}</div>`;
        const head = `<div class="nut-evo-it-head"><span class="nut-evo-it-name">${esc(par[LANG] || par.parametro)}</span>`
            + `<span class="nut-evo-it-unit">${esc(par.unidad||'')}</span></div>`
            + `<div class="nut-evo-it-last">${t('Último')}: <strong>${fmtP(ultimo.v, par)}</strong>`
            + (banda ? ` · <span style="color:${banda.color}">${esc(banda.label)}</span>` : '')
            + ` · <span class="sem-muted-xs">${esc(fmtFecha(ultimo.f))}</span></div>`;
        return S.evoFocus
            ? `<div class="nut-evo-focus">${head}${chart}</div>`
            : `<button type="button" class="nut-evo-item" onclick="evoFocus('${esc(par.id)}')">${head}${chart}</button>`;
    }).filter(Boolean).join('');

    body.innerHTML = cards
        ? (S.evoFocus ? cards : `<div class="nut-evo-grid">${cards}</div>`)
        : `<div class="nut-evo-empty">${t('Sin serie temporal para esta unidad.')}</div>`;
}

function switchMode(modo){
    currentMode = modo;
    if(modo === 'foliares' || modo === 'suelo'){
        NUTRI_SUBMODE = modo;
        const grupo = modo === 'foliares' ? 'foliar' : 'suelo';
        const disponibles = matricesDeGrupo(grupo);
        if(!disponibles.some(m => m.id === S.nut.matriz)){
            S.nut.matriz = disponibles.length ? disponibles[0].id : null;
            S.nut.param = null; S.nut.fecha = null; S.nut.prof = null;
        }
    }

    document.querySelectorAll('.tab-btn').forEach(b => {
        const modos = (b.dataset.modes || b.dataset.mode || '').split(' ');
        b.classList.toggle('active', modos.includes(modo));
    });
    document.querySelectorAll('.nut-subtab').forEach((b,i) => {
        const on = (i === 0 && modo === 'foliares') || (i === 1 && modo === 'suelo');
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    document.body.classList.toggle('foliar-active', modo === 'foliares');
    document.body.classList.toggle('soil-active', modo === 'suelo');
    document.body.classList.toggle('riego-active', modo === 'riego');
    document.getElementById('ctrlGeneral').classList.toggle('visible', modo === 'general');
    document.getElementById('ctrlRiego').classList.toggle('visible', modo === 'riego');
    document.getElementById('ctrlNutricion').classList.toggle('visible',
        modo === 'foliares' || modo === 'suelo');

    // La consulta a DropControl tarda ~2 s: se dispara al entrar a la pestaña,
    // no en el load inicial, y se cachea en memoria hasta que se pida
    // "Actualizar". El mapa dibuja mientras tanto con el estado "cargando".
    if(modo === 'riego') cargarRiego(false);

    // Al cambiar de pestaña, la selección se mantiene si el nivel sigue existiendo.
    if(S.sel && S.selNivel !== nivelActivo()){
        map.setFeatureState({source:S.selNivel, id:S.sel}, {sel:false});
        S.sel = null; S.selNivel = null;
        document.body.classList.remove('ket-panel');
    }

    poblarSelectores();
    repintar();
    renderPanel();
    map.resize();
}

function setNivelGen(v, silencioso){
    S.gen.nivel = v;
    document.querySelectorAll('#segNivelGen button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === v));
    // Un criterio que no aplica al nivel nuevo cae al primero que sí aplica.
    if(!CRITERIOS[S.gen.color].niveles.includes(v)){
        S.gen.color = Object.keys(CRITERIOS).find(k => CRITERIOS[k].niveles.includes(v));
    }
    poblarSelectores();
    if(!silencioso) limpiarSeleccionSiCambiaNivel(v);
    repintar();
}
function setColorGen(v){
    S.gen.color = v;
    document.getElementById('selColor').value = v;
    repintar();
}

function setNivelNut(v, silencioso){
    S.nut.nivel = v;
    document.querySelectorAll('#segNivelNut button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === v));
    if(!silencioso) limpiarSeleccionSiCambiaNivel(v);
    repintar();
    renderPanel();
}
function limpiarSeleccionSiCambiaNivel(v){
    if(S.sel && S.selNivel !== v){
        map.setFeatureState({source:S.selNivel, id:S.sel}, {sel:false});
        S.sel = null; S.selNivel = null;
        document.body.classList.remove('ket-panel');
        map.resize();
    }
}

function setMatriz(v){
    S.nut.matriz = v; S.nut.param = null; S.nut.fecha = null; S.nut.prof = null;
    poblarSelectores(); repintar(); renderPanel();
}
function setParam(v){ S.nut.param = v; poblarSelectores(true); repintar(); renderPanel(); }
function setFecha(v){ S.nut.fecha = v || null; repintar(); renderPanel(); }
function setProf(v){ S.nut.prof = v || null; repintar(); renderPanel(); }

function setCapa(capa, on){
    S.capas[capa] = on;
    if(capa === 'etiquetas'){
        ['chkEtiquetas','chkEtiquetasNut','chkEtiquetasRiego'].forEach(id => {
            const el = document.getElementById(id); if(el) el.checked = on;
        });
    }
    if(capa === 'valvulas'){
        ['chkValvulas','chkValvulasRiego'].forEach(id => {
            const el = document.getElementById(id); if(el) el.checked = on;
        });
    }
    repintar();
}

function buscarUnidad(txt){
    const q = (txt || '').trim().toUpperCase();
    if(!q) return;
    for(const nivel of POLY_NIVELES){
        const f = GEO[nivel].features.find(x =>
            x.properties.id.toUpperCase() === q ||
            (x.properties.name || '').toUpperCase() === q);
        if(f){
            if(currentMode === 'general') setNivelGen(nivel, true); else setNivelNut(nivel, true);
            seleccionar(nivel, f.properties.id, true);
            document.getElementById('inpBuscar').value = '';
            return;
        }
    }
}

/* ── Poblado de selectores ──────────────────────────────────────────────── */
function poblarSelectores(soloDependientes){
    if(!GEO) return;

    if(!soloDependientes){
        const selC = document.getElementById('selColor');
        selC.innerHTML = Object.entries(CRITERIOS)
            .filter(([,c]) => c.niveles.includes(S.gen.nivel))
            .map(([k,c]) => `<option value="${k}"${k===S.gen.color?' selected':''}>${esc(t(c.es))}</option>`)
            .join('');

        const dl = document.getElementById('dlUnidades');
        dl.innerHTML = POLY_NIVELES.flatMap(n =>
            GEO[n].features.map(f => `<option value="${esc(f.properties.id)}">${esc(f.properties.etiqueta || '')}</option>`)
        ).join('');
    }

    const selM = document.getElementById('selMetricaRiego');
    if(selM) selM.innerHTML = METRICAS_RIEGO.map(m =>
        `<option value="${m.id}"${m.id===S.riego.metrica?' selected':''}>`
        + `${esc(t(m.es))}${m.unidad?' ('+esc(m.unidad)+')':''}</option>`).join('');
    document.querySelectorAll('#segNivelRiego button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === S.riego.nivel));

    if(!NUT) return;

    const grupo = NUTRI_SUBMODE === 'foliares' ? 'foliar' : 'suelo';
    const mats = matricesDeGrupo(grupo);
    document.getElementById('grpMatriz').style.display = mats.length > 1 ? '' : 'none';
    document.getElementById('selMatriz').innerHTML = mats.map(m =>
        `<option value="${esc(m.id)}"${m.id===S.nut.matriz?' selected':''}>${esc(t(m.es))} (${m.n})</option>`).join('');

    const ps = paramsActuales();
    if(!S.nut.param || !ps.some(p => p.id === S.nut.param)) S.nut.param = ps.length ? ps[0].id : null;
    document.getElementById('selParam').innerHTML = ps.map(p => {
        const src = p.escala === 'umbral' ? (p.umbral.fuente === 'laboquim' ? '·lab' : '·ref') : '·rel';
        return `<option value="${esc(p.id)}"${p.id===S.nut.param?' selected':''}>`
             + `${esc(p[LANG] || p.parametro)}${p.unidad?' ('+esc(p.unidad)+')':''} ${src}</option>`;
    }).join('');

    const cs = campanasActuales();
    if(S.nut.fecha && !cs.some(c => c.fecha === S.nut.fecha)) S.nut.fecha = null;
    if(!S.nut.fecha && cs.length) S.nut.fecha = cs[0].fecha;
    document.getElementById('selFecha').innerHTML =
        `<option value=""${!S.nut.fecha?' selected':''}>${t('Todas las unidades')==='All units' ? 'All samplings' : 'Todos los muestreos'}</option>`
        + cs.map(c => `<option value="${esc(c.fecha)}"${c.fecha===S.nut.fecha?' selected':''}>`
            + `${esc(fmtFecha(c.fecha))}${c.aprox?' *':''} · ${plural(c.ubicaciones,'unidad','unidades')}</option>`).join('');

    const m = matrizActual();
    const profs = m ? m.profundidades : [];
    document.getElementById('grpProf').style.display = profs.length ? '' : 'none';
    if(S.nut.prof && !profs.includes(S.nut.prof)) S.nut.prof = null;
    document.getElementById('selProf').innerHTML =
        `<option value=""${!S.nut.prof?' selected':''}>${LANG==='en'?'All depths':'Todas'}</option>`
        + profs.map(d => `<option value="${esc(d)}"${d===S.nut.prof?' selected':''}>${esc(d)}${/^\d+$/.test(d)?' cm':''}</option>`).join('');

    document.querySelectorAll('#segNivelGen button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === S.gen.nivel));
    document.querySelectorAll('#segNivelNut button').forEach(b =>
        b.classList.toggle('active', b.dataset.v === S.nut.nivel));
}

/* ═══════════════════════════════════════════════════════════════════════════
   ARRANQUE
   ═══════════════════════════════════════════════════════════════════════════ */

async function boot(){
    applyI18n();
    DATA_VERSION = (await loadDataset('version', './data-version.json')) || {};
    const [geo, nut] = await Promise.all([
        loadDataset('geo', './geo_data.json'),
        loadDataset('nutricion', './nutricion_data.json')
    ]);
    GEO = geo; NUT = nut;
    renderNotice();
    if(!GEO){
        document.getElementById('legend').innerHTML =
            `<div class="legend-label">${t('No se pudo cargar')} geo_data.json</div>`;
        return;
    }

    POLY_NIVELES.forEach(n => {
        IDX[n] = new Map(GEO[n].features.map(f => [f.properties.id, f.properties]));
    });
    IDX.calicatas = new Map(((NUT && NUT.calicatas) ? NUT.calicatas.features : [])
        .map(f => [f.properties.id, f.properties]));

    inicializarMapa();
}

/* El estilo y los JSON cargan en paralelo y el orden no está garantizado. Esta
   función es idempotente y la llaman los dos: arranca cuando llega el último.
   (Con `map.on('load', …)` registrado después de los fetch, si el evento ya
   había pasado el mapa se quedaba sin capas: pasaba una vez de cada tres.) */
let estiloListo = false;
map.on('load', () => { estiloListo = true; inicializarMapa(); });

function encuadrarPredio(duracion){
    map.fitBounds([[GEO.bbox[0], GEO.bbox[1]], [GEO.bbox[2], GEO.bbox[3]]],
                  {padding:70, duration:duracion ?? 700});
}

function inicializarMapa(){
    if(!GEO || !estiloListo || map.getLayer('sectores-fill')) return;
    addLayers();
    encuadrarPredio(0);
    poblarSelectores();
    switchMode('general');
}

document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(document.getElementById('evoOver').classList.contains('visible')) closeEvo();
    else if(S.sel) cerrarPanel();
});

boot();
</script>
